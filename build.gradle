plugins {
    id 'base'
}

version = mod_version
group = mod_group_id

tasks.register('buildForge') {
    group = 'build'
    description = 'Builds the Forge mod jar.'
    dependsOn ':forge:build'
}

tasks.register('buildNeoForge') {
    group = 'build'
    description = 'Builds the NeoForge mod jar.'
    dependsOn ':neoforge:build'
}

tasks.named('build') {
    dependsOn ':forge:build', ':neoforge:build'
}
