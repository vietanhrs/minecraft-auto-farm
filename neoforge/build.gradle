plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id
base.archivesName = "${mod_id}-neoforge"

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

sourceSets {
    main {
        java.srcDirs = [
                rootProject.file('src/common/java'),
                rootProject.file('src/neoforge/java')
        ]
        resources.srcDirs = [
                rootProject.file('src/common/resources'),
                rootProject.file('src/neoforge/resources'),
                rootProject.file('src/generated/resources')
        ]
    }
}

neoForge {
    version = neoforge_version

    runs {
        configureEach {
            gameDirectory = rootProject.file('run')
            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
        }

        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }

        data {
            data()
            gameDirectory = rootProject.file('run-data')
            programArguments.addAll '--mod', mod_id, '--all',
                    '--output', rootProject.file('src/generated/resources').absolutePath,
                    '--existing', rootProject.file('src/common/resources').absolutePath,
                    '--existing', rootProject.file('src/neoforge/resources').absolutePath
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
}

processResources {
    def replaceProperties = [
            mod_version      : mod_version,
            mod_id           : mod_id,
            mod_name         : mod_name,
            mod_license      : mod_license,
            mod_authors      : mod_authors,
            neoforge_version : neoforge_version,
            minecraft_version: minecraft_version
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
    filesMatching('pack.mcmeta') {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
